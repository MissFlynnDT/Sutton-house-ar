<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets></a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-image
  src="./52e41b9f-9aeb-4d20-8044-8c4f0726b365.png"
  position="0 0 0.01"
  width="1"
  height="1">
</a-image>
    <<!-- Colour burst coming out of the worksheet -->

<a-sphere
  position="-0.25 0 0.10"
  radius="0.07"
  color="#FF5FA2"
  animation="property: position;
             from: -0.25 0 0.05;
             to: -0.25 0 0.35;
             dir: alternate;
             loop: true;
             dur: 1400;">
</a-sphere>

<a-sphere
  position="0 0.15 0.10"
  radius="0.09"
  color="#8A4FFF"
  animation="property: position;
             from: 0 0.15 0.05;
             to: 0 0.15 0.45;
             dir: alternate;
             loop: true;
             dur: 1700;">
</a-sphere>

<a-sphere
  position="0.25 -0.10 0.10"
  radius="0.06"
  color="#36D6C5"
  animation="property: position;
             from: 0.25 -0.10 0.05;
             to: 0.25 -0.10 0.30;
             dir: alternate;
             loop: true;
             dur: 1200;">
</a-sphere>

<a-torus
  position="0 0 0.18"
  radius="0.28"
  radius-tubular="0.015"
  color="#FFD84D"
  animation="property: rotation;
             to: 0 0 360;
             loop: true;
             dur: 5000;
             easing: linear;">
</a-torus>

  </a-entity>

</a-scene>

</body>
</html>
