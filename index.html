<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets></a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-image
  src="./52e41b9f-9aeb-4d20-8044-8c4f0726b365.png"
  position="0 0 0.01"
  width="1"
  height="1">
</a-image>
    <<!-- Colour burst coming out of the worksheet -->
<!-- 3D EARTH HOUSE TREE -->

<a-entity position="0 -0.08 0.04">

  <!-- Tree trunk -->
  <a-cylinder
    position="0 -0.10 0.14"
   radius="0.075"
height="0.48"
    color="#8B5A2B">
  </a-cylinder>

  <!-- Main green canopy -->
  <a-sphere
    position="0 0.20 0.15"
    radius="0.22"
    scale="1.25 0.85 0.55"
    color="#55A85A"
    animation="property: rotation;
               from: 0 -2 -1;
               to: 0 2 1;
               dir: alternate;
               loop: true;
               dur: 2500;
               easing: easeInOutSine;">
  </a-sphere>

  <!-- Left canopy -->
  <a-sphere
    position="-0.18 0.13 0.13"
    radius="0.17"
    scale="1.1 0.9 0.55"
    color="#73BF69">
  </a-sphere>

  <!-- Right canopy -->
  <a-sphere
    position="0.18 0.12 0.13"
    radius="0.17"
    scale="1.1 0.9 0.55"
    color="#3E9148">
  </a-sphere>

  <!-- Colourful leaves -->
  <a-sphere
    position="-0.18 0.23 0.31"
    radius="0.035"
    color="#F4D35E">
  </a-sphere>

  <a-sphere
    position="0.15 0.25 0.32"
    radius="0.035"
    color="#FF8FA3">
  </a-sphere>

  <a-sphere
    position="-0.08 0.34 0.30"
    radius="0.035"
    color="#8A6FD1">
  </a-sphere>

  <a-sphere
    position="0.24 0.12 0.29"
    radius="0.035"
    color="#F29E4C">
  </a-sphere>

  <!-- Heart on trunk -->
  <a-text
    value="♥"
    position="0 -0.08 0.205"
    align="center"
    color="#FF7FA5"
    width="0.32">
  </a-text>

</a-entity>




  </a-entity>

</a-scene>

</body>
</html>
